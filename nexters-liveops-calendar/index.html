<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Ops Calendar</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FFFFFF;
               font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
               color:#111317; -webkit-font-smoothing:antialiased; }
  #stage { position:absolute; inset:0; overflow:hidden; }
  svg { display:block; }
</style>
</head>
<body>
<div id="stage"></div>

<!-- React must load BEFORE the Sigma plugin SDK. The unversioned UMD bundle at
     unpkg calls React.createContext() at module-evaluation time, so without a
     global React it throws part-way through the factory, leaves
     window.SigmaPlugin as an empty object, and the tile renders blank with no
     visible error -- even for a plugin like this one that never touches React. -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<script>
(function () {
  "use strict";

  // Nexters' own palette, sampled from nexters.com's stylesheet (#ff9d00 is
  // the orange four-pointed star that forms the X in the wordmark), not
  // guessed.
  var INK   = "#111317";
  var ORNG  = "#FF9D00";
  var GOLD  = "#FCB514";
  var AMBER = "#B45309";
  var GREEN = "#1E8A55";
  var GREY  = "#8A8F98";
  var PALE  = "#C7CAD1";
  var HAIR  = "#E7E8EC";
  var WKND  = "#F6F7F9";

  // one colour per live-ops event TYPE -- the whole point of the tile is that
  // you can see WHICH KIND of event moved the number
  var TYPE_FILL = {
    "Season": INK, "Gacha banner": ORNG, "Sale": AMBER,
    "Guild war": GREEN, "Tournament": GREY, "Collab": GOLD
  };

  var DAYS = 42;
  var stage = document.getElementById("stage");

  // --- the fallback shape ---------------------------------------------------
  // A plugin has to look right UNBOUND, or the editor panel is impossible to
  // configure and a mis-wired column reads as a broken tile rather than as a
  // mis-wired column. This reproduces live_ops_calendar_sql's own schedule and
  // its index arithmetic, so the layout can be judged before anything is bound.
  var SCHED = {
    "Hero Wars: Alliance": [[0,7,"Season 47 Battle Pass","Season",34],
      [9,4,"Titan Valley — limited banner","Gacha banner",52],
      [16,3,"Guild War: Clash of Titans","Guild war",28],
      [21,7,"Summer Adventure","Season",41],
      [31,4,"Astral Summon x2","Gacha banner",46],
      [37,3,"Grand Arena Finals","Tournament",24]],
    "Hero Wars: Dominion Era": [[2,5,"Dominion Season 14","Season",38],
      [11,3,"Web-shop Founders Sale","Sale",62],
      [18,6,"Territory Conquest","Guild war",31],
      [27,4,"Legendary Hero Debut","Gacha banner",48],
      [34,5,"Anniversary Web Bundle","Sale",71]],
    "Zombie Miner": [[1,3,"Prestige Rush","Tournament",44],
      [6,4,"Deep Shaft Expedition","Season",36],
      [13,3,"x3 Offline Earnings","Sale",58],
      [19,5,"Mutant Mines","Season",39],
      [26,3,"Rebirth Weekend","Sale",51],
      [33,6,"Toxic Depths","Season",42]],
    "Pixel Gun 3D": [[3,6,"Summer Season 42","Season",29],
      [12,4,"Sniper Championship","Tournament",33],
      [20,3,"Weapon Crate Sale","Sale",41],
      [25,7,"Beach Party Event","Season",26],
      [35,4,"Clan Cup Finals","Tournament",31]],
    "Island Hoppers": [[0,5,"Lagoon Festival","Season",47],
      [8,3,"Merge Mania Weekend","Tournament",38],
      [14,6,"Volcano Expedition","Season",43],
      [23,4,"Starter Bundle Blitz","Sale",66],
      [30,7,"Treasure Tides","Season",39],
      [39,3,"Collab: Tiki Tales","Collab",54]],
    "Dawn of Zombies": [[4,5,"Radiation Season 9","Season",31],
      [12,3,"Raid Weekend","Guild war",27],
      [17,4,"Bunker Supply Drop","Sale",44],
      [24,6,"Contaminated Zone","Season",33],
      [32,3,"Survivor Tournament","Tournament",29],
      [37,4,"Winter Stockpile Sale","Sale",39]]
  };
  var ORDER = ["Hero Wars: Alliance", "Hero Wars: Dominion Era", "Zombie Miner",
               "Pixel Gun 3D", "Island Hoppers", "Dawn of Zombies"];
  var PAYERS = { "Hero Wars: Alliance": 14.2, "Hero Wars: Dominion Era": 6.1,
                 "Zombie Miner": 4.4, "Pixel Gun 3D": 3.6,
                 "Island Hoppers": 2.1, "Dawn of Zombies": 1.6 };
  // day 0 is Monday 22 Jun 2026, so weekday = d % 7 with 5 and 6 being the
  // weekend. The fallback has to print REAL dates: the peak caption echoes
  // this string verbatim, and "Sun 56" reads as a broken tile.
  var WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var DAY0 = Date.UTC(2026, 5, 22);
  function dayLabel(d) {
    var dt = new Date(DAY0 + d * 86400000);
    return WD[d % 7] + " " + dt.getUTCDate();
  }

  function synth() {
    var out = [];
    for (var g = 0; g < ORDER.length; g++) {
      var title = ORDER[g], evs = SCHED[title];
      for (var d = 0; d < DAYS; d++) {
        var wd = d % 7;
        var idx = 100 * (wd >= 5 ? 1.12 : wd === 4 ? 1.05 : 1.0);
        var name = "", kind = "", best = 0;
        for (var e = 0; e < evs.length; e++) {
          var st = evs[e][0], len = evs[e][1], lift = evs[e][4];
          if (d >= st && d < st + len) {
            var inside = d - st, shape = Math.pow(0.82, inside);
            if (inside === len - 1 && (evs[e][3] === "Sale" || evs[e][3] === "Season")) {
              shape += 0.35;
            }
            idx += lift * shape;
            if (lift > best) { best = lift; name = evs[e][2]; kind = evs[e][3]; }
          }
        }
        idx = Math.round(idx * 10) / 10;
        out.push({ game: title, day: d, label: dayLabel(d),
                   event: name || "No event", type: kind || "Baseline",
                   index: idx, payers: Math.round(PAYERS[title] * idx) / 100 });
      }
    }
    return out;
  }

  // --- Sigma hands back columns, not rows -----------------------------------
  function toRows(data, cfg) {
    if (!data) return null;
    var gm = data[cfg.game], dy = data[cfg.day], ix = data[cfg.index];
    if (!gm || !dy || !ix) return null;
    var lb = data[cfg.label] || [], ev = data[cfg.event] || [],
        tp = data[cfg.type] || [], py = data[cfg.payers] || [];
    var out = [];
    for (var i = 0; i < gm.length; i++) {
      out.push({ game: String(gm[i]), day: Number(dy[i]),
                 label: lb[i] == null ? "" : String(lb[i]),
                 event: ev[i] == null ? "" : String(ev[i]),
                 type: tp[i] == null ? "" : String(tp[i]),
                 index: Number(ix[i]),
                 payers: py[i] == null ? 0 : Number(py[i]) });
    }
    return out;
  }

  // Group the flat (game, day) grid into one band per title, preserving the
  // order the rows arrived in so the table's own sort is what the viewer sees.
  // Event RUNS are rebuilt from consecutive days carrying the same event name,
  // rather than trusted from a separate column -- that way a filtered or
  // partial result still draws correct brackets instead of one long smear.
  function group(rows) {
    var order = [], by = {};
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!by[r.game]) { by[r.game] = { game: r.game, cells: [] }; order.push(r.game); }
      by[r.game].cells[r.day] = r;
    }
    var out = [];
    for (var j = 0; j < order.length; j++) {
      var b = by[order[j]], runs = [], sum = 0, n = 0, peak = null;
      var cur = null;
      for (var d = 0; d < DAYS; d++) {
        var c = b.cells[d];
        if (c) {
          sum += c.index; n++;
          if (!peak || c.index > peak.index) peak = c;
        }
        var nm = c && c.event && c.event !== "No event" ? c.event : null;
        if (cur && cur.name !== nm) { runs.push(cur); cur = null; }
        if (nm) {
          if (!cur) cur = { name: nm, type: c.type, start: d, end: d, peak: c.index };
          else { cur.end = d; cur.peak = Math.max(cur.peak, c.index); }
        }
      }
      if (cur) runs.push(cur);
      b.runs = runs;
      b.avg = n ? sum / n : 100;
      b.peak = peak;
      b.days = n;
      out.push(b);
    }
    return out;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function clip(s, n) {
    s = String(s);
    return s.length <= n ? s : s.slice(0, Math.max(1, n - 1)) + "…";
  }

  // The index ramp. Piecewise so 100 (a title's own baseline) is visibly the
  // neutral point and everything above it warms toward the brand orange --
  // a single linear ramp buries the difference between a quiet day and a
  // 40-point lift in the same pale band.
  var RAMP = [[92, "#EFF0F3"], [100, "#FFF4E2"], [112, "#FFDFAE"],
              [125, "#FFC062"], [140, "#FF9D00"], [160, "#C96A00"],
              [185, "#8A5100"]];

  function fillFor(v) {
    if (!isFinite(v)) return "#FFFFFF";
    if (v <= RAMP[0][0]) return RAMP[0][1];
    for (var i = 1; i < RAMP.length; i++) {
      if (v <= RAMP[i][0]) {
        var a = RAMP[i - 1], b = RAMP[i];
        var t = (v - a[0]) / (b[0] - a[0]);
        return mix(a[1], b[1], t);
      }
    }
    return RAMP[RAMP.length - 1][1];
  }

  function mix(a, b, t) {
    function ch(h, i) { return parseInt(h.slice(1 + i * 2, 3 + i * 2), 16); }
    var r = Math.round(ch(a, 0) + (ch(b, 0) - ch(a, 0)) * t),
        g = Math.round(ch(a, 1) + (ch(b, 1) - ch(a, 1)) * t),
        bl = Math.round(ch(a, 2) + (ch(b, 2) - ch(a, 2)) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  // white text on the dark end of the ramp, ink on the pale end
  function inkOn(v) { return v >= 138 ? "#FFFFFF" : INK; }

  var rows = synth();
  var state = "preview";
  var diag = "";

  function draw(data, W, H) {
    var bands = group(data).slice(0, 8);
    var n = bands.length || 1;

    var padL = 12, padR = 12;
    var headH = 22, axisH = 26, legH = 22;
    var labelW = Math.max(148, Math.min(206, Math.round(W * 0.142)));
    var statW = 86;                       // the per-title peak / average block
    var gridX = padL + labelW + 8;
    var gridW = Math.max(120, W - gridX - statW - padR);
    var cellW = gridW / DAYS;
    var bodyTop = headH + axisH;
    var bodyH = Math.max(60, H - bodyTop - legH);
    var rowH = bodyH / n;
    // the event bracket lives UNDER the cells inside the same band, so the
    // band has to split its height between the two
    var cellH = Math.max(10, Math.min(40, rowH * 0.56));
    var runH = Math.max(8, Math.min(15, rowH * 0.26));

    var s = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W +
             '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">'];

    // --- header: the one thing an exec reads off this tile ------------------
    // the biggest single event in the window, by lift over its title's own
    // baseline -- computed here, not asserted, so it cannot disagree with the
    // cells beside it
    var top = null;
    for (var b = 0; b < bands.length; b++) {
      for (var r = 0; r < bands[b].runs.length; r++) {
        var run = bands[b].runs[r];
        var lift = run.peak - 100;
        if (!top || lift > top.lift) {
          top = { lift: lift, name: run.name, game: bands[b].game, type: run.type };
        }
      }
    }
    var totRuns = 0;
    for (var b0 = 0; b0 < bands.length; b0++) totRuns += bands[b0].runs.length;
    if (top) {
      s.push('<text x="' + padL + '" y="16" font-size="10.5" fill="' + GREY +
             '">Biggest lift: <tspan font-weight="700" fill="' + INK + '">' +
             esc(clip(top.name, 38)) + '</tspan> on ' + esc(clip(top.game, 26)) +
             ' <tspan font-weight="700" fill="' + AMBER + '">+' +
             Math.round(top.lift) + ' pts</tspan></text>');
    }
    s.push('<text x="' + (W - padR) + '" y="16" text-anchor="end" font-size="9.5" fill="' +
           GREY + '">' + bands.length + ' titles · ' + totRuns + ' events · index 100 = ' +
           'each title’s own non-event baseline</text>');
    if (state !== "bound" && state !== "preview") {
      s.push('<text x="' + (W - padR) + '" y="7" text-anchor="end" font-size="8.5" fill="' +
             AMBER + '">' + esc(state) + (diag ? " · " + esc(diag) : "") + '</text>');
    }

    // --- weekend tint bands, drawn first so everything sits on top ----------
    for (var d = 0; d < DAYS; d++) {
      if (d % 7 >= 5) {
        s.push('<rect x="' + (gridX + d * cellW).toFixed(1) + '" y="' + (bodyTop - axisH + 12) +
               '" width="' + cellW.toFixed(1) + '" height="' + (bodyH + axisH - 12) +
               '" fill="' + WKND + '"/>');
      }
    }
    // week separators
    for (var wk = 0; wk <= DAYS / 7; wk++) {
      var x = gridX + wk * 7 * cellW;
      s.push('<line x1="' + x.toFixed(1) + '" y1="' + (bodyTop - axisH + 12) + '" x2="' +
             x.toFixed(1) + '" y2="' + (bodyTop + bodyH) + '" stroke="' + HAIR +
             '" stroke-width="1"/>');
      if (wk < DAYS / 7) {
        s.push('<text x="' + (x + 3.5 * cellW).toFixed(1) + '" y="' + (headH + 10) +
               '" text-anchor="middle" font-size="8.5" font-weight="700" fill="' + GREY +
               '" letter-spacing="0.5">WEEK ' + (wk + 1) + '</text>');
      }
    }
    // day-of-week initials, only when there is room for them
    if (cellW >= 13) {
      for (var d2 = 0; d2 < DAYS; d2++) {
        s.push('<text x="' + (gridX + (d2 + 0.5) * cellW).toFixed(1) + '" y="' +
               (bodyTop - 4) + '" text-anchor="middle" font-size="7.5" fill="' +
               (d2 % 7 >= 5 ? AMBER : PALE) + '">' + WD[d2 % 7].charAt(0) + '</text>');
      }
    }

    // --- one band per title -------------------------------------------------
    for (var i = 0; i < bands.length; i++) {
      var g = bands[i];
      var y = bodyTop + i * rowH;
      var cy = y + 2;

      s.push('<text x="' + padL + '" y="' + (cy + cellH * 0.62).toFixed(1) +
             '" font-size="' + (cellH >= 20 ? 11 : 10) + '" font-weight="700" fill="' +
             INK + '">' + esc(clip(g.game, Math.floor(labelW / 6.4))) + '</text>');
      if (rowH >= 46) {
        s.push('<text x="' + padL + '" y="' + (cy + cellH * 0.62 + 12).toFixed(1) +
               '" font-size="8.5" fill="' + GREY + '">' + g.runs.length +
               ' events · avg index ' + g.avg.toFixed(0) + '</text>');
      }

      // the 42 day cells
      for (var d3 = 0; d3 < DAYS; d3++) {
        var c = g.cells[d3];
        var x2 = gridX + d3 * cellW;
        if (!c) {
          s.push('<rect x="' + (x2 + 0.5).toFixed(1) + '" y="' + cy.toFixed(1) +
                 '" width="' + Math.max(1, cellW - 1).toFixed(1) + '" height="' +
                 cellH.toFixed(1) + '" fill="#FFFFFF" stroke="' + HAIR + '"/>');
          continue;
        }
        s.push('<rect x="' + (x2 + 0.5).toFixed(1) + '" y="' + cy.toFixed(1) +
               '" width="' + Math.max(1, cellW - 1).toFixed(1) + '" height="' +
               cellH.toFixed(1) + '" rx="1.5" fill="' + fillFor(c.index) + '">' +
               '<title>' + esc(g.game) + " — " + esc(c.label) + "\n" +
               esc(c.event) + " (" + esc(c.type) + ")\n" +
               "index " + c.index.toFixed(0) + " · " + c.payers.toFixed(2) +
               "K paying users" + '</title></rect>');
        // the index printed in the cell, once the cells are wide enough to
        // carry three digits without colliding
        if (cellW >= 22 && cellH >= 16) {
          s.push('<text x="' + (x2 + cellW / 2).toFixed(1) + '" y="' +
                 (cy + cellH / 2 + 3.2).toFixed(1) + '" text-anchor="middle" font-size="8.5" fill="' +
                 inkOn(c.index) + '">' + c.index.toFixed(0) + '</text>');
        }
      }

      // the event runs, as labelled bars under the cells
      var ry = cy + cellH + 2;
      for (var r2 = 0; r2 < g.runs.length; r2++) {
        var run2 = g.runs[r2];
        var rx = gridX + run2.start * cellW + 0.5;
        var rw = Math.max(2, (run2.end - run2.start + 1) * cellW - 1);
        var fill = TYPE_FILL[run2.type] || GREY;
        s.push('<rect x="' + rx.toFixed(1) + '" y="' + ry.toFixed(1) + '" width="' +
               rw.toFixed(1) + '" height="' + runH.toFixed(1) + '" rx="' +
               (runH / 2).toFixed(1) + '" fill="' + fill + '">' +
               '<title>' + esc(run2.name) + " (" + esc(run2.type) + ") · " +
               (run2.end - run2.start + 1) + " days · peak index " +
               run2.peak.toFixed(0) + '</title></rect>');
        // the name goes INSIDE the bar when the run is wide enough, otherwise
        // it is dropped -- a label that overflows its run points at the wrong
        // days, which is worse than no label
        var room = Math.floor((rw - 8) / 5.1);
        if (room >= 6 && runH >= 9) {
          s.push('<text x="' + (rx + 4).toFixed(1) + '" y="' +
                 (ry + runH * 0.75).toFixed(1) + '" font-size="' +
                 Math.min(9, runH - 2).toFixed(1) + '" fill="' +
                 (fill === INK || fill === AMBER || fill === GREEN ? "#FFFFFF" : INK) +
                 '">' + esc(clip(run2.name, room)) + '</text>');
        }
      }

      // the per-title peak, on the right
      if (g.peak) {
        s.push('<text x="' + (W - padR) + '" y="' + (cy + cellH * 0.52).toFixed(1) +
               '" text-anchor="end" font-size="11" font-weight="700" fill="' +
               AMBER + '">' + g.peak.index.toFixed(0) + '</text>');
        s.push('<text x="' + (W - padR) + '" y="' + (cy + cellH * 0.52 + 11).toFixed(1) +
               '" text-anchor="end" font-size="8" fill="' + GREY + '">peak ' +
               esc(g.peak.label) + '</text>');
      }
      s.push('<line x1="' + padL + '" y1="' + (y + rowH - 1).toFixed(1) + '" x2="' +
             (W - padR) + '" y2="' + (y + rowH - 1).toFixed(1) + '" stroke="' + HAIR + '"/>');
    }

    // --- legend -------------------------------------------------------------
    var ly = H - legH + 8;
    var lx = padL;
    s.push('<text x="' + lx + '" y="' + (ly + 8) + '" font-size="8.5" font-weight="700" fill="' +
           GREY + '" letter-spacing="0.5">EVENT TYPE</text>');
    lx += 74;
    var types = ["Season", "Gacha banner", "Sale", "Guild war", "Tournament", "Collab"];
    for (var t2 = 0; t2 < types.length; t2++) {
      s.push('<rect x="' + lx + '" y="' + (ly + 1) + '" width="9" height="9" rx="4.5" fill="' +
             TYPE_FILL[types[t2]] + '"/>');
      s.push('<text x="' + (lx + 13) + '" y="' + (ly + 8.5) + '" font-size="8.5" fill="' +
             INK + '">' + types[t2] + '</text>');
      lx += 18 + types[t2].length * 5.0;
    }
    // the ramp, right-aligned
    var rampW = Math.min(170, Math.max(90, W * 0.12));
    var rxs = W - padR - rampW - 30;
    if (rxs > lx + 20) {
      for (var q = 0; q < 40; q++) {
        var v = 92 + (185 - 92) * (q / 39);
        s.push('<rect x="' + (rxs + q * rampW / 40).toFixed(1) + '" y="' + (ly + 1) +
               '" width="' + (rampW / 40 + 0.6).toFixed(1) + '" height="9" fill="' +
               fillFor(v) + '"/>');
      }
      s.push('<text x="' + (rxs - 6) + '" y="' + (ly + 8.5) +
             '" text-anchor="end" font-size="8.5" fill="' + GREY + '">index 92</text>');
      s.push('<text x="' + (rxs + rampW + 4) + '" y="' + (ly + 8.5) +
             '" font-size="8.5" fill="' + GREY + '">185+</text>');
    }

    s.push('</svg>');
    stage.innerHTML = s.join("");
  }

  function render() {
    var r = stage.getBoundingClientRect();
    draw(rows, Math.max(420, Math.round(r.width)), Math.max(180, Math.round(r.height)));
  }

  // ResizeObserver on the STAGE, not a window resize listener: the plugin lives
  // in an iframe Sigma resizes without firing a window resize event. And no
  // animation loop anywhere -- a headless PNG export never reaches idle on a
  // plugin that animates.
  if (typeof ResizeObserver === "function") {
    new ResizeObserver(render).observe(stage);
  } else {
    window.addEventListener("resize", render);
  }
  render();

  // window.SigmaPlugin -- the UMD bundle exposes itself FLAT. The
  // window.sigmaComputing.plugin shape in the docs throws on the first line and
  // the tile never paints.
  var SP = window.SigmaPlugin;
  if (!SP || !SP.client) return;    // unbound preview: keep the synth fallback
  var client = SP.client;

  client.config.configureEditorPanel([
    { name: "source", type: "element" },
    { name: "game", type: "column", source: "source", allowedTypes: ["text"], label: "Game" },
    { name: "day", type: "column", source: "source", allowedTypes: ["number"], label: "Day Index" },
    { name: "label", type: "column", source: "source", allowedTypes: ["text"], label: "Day Label" },
    { name: "event", type: "column", source: "source", allowedTypes: ["text"], label: "Event" },
    { name: "type", type: "column", source: "source", allowedTypes: ["text"], label: "Event Type" },
    { name: "index", type: "column", source: "source", allowedTypes: ["number"], label: "Revenue Index" },
    { name: "payers", type: "column", source: "source", allowedTypes: ["number"], label: "Paying Users" }
  ]);

  var unsub = null;
  client.config.subscribe(function (cfg) {
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
    if (!cfg || !cfg.source) {
      state = "no config"; diag = ""; rows = synth(); render(); return;
    }
    state = "awaiting data"; diag = ""; render();
    unsub = client.elements.subscribeToElementData(cfg.source, function (data) {
      var next = toRows(data, cfg);
      if (next && next.length) {
        state = "bound"; diag = ""; rows = next;
      } else {
        // name what actually arrived: if the keys are not the configured
        // column ids, the tile looks identical to a slow load
        state = "no rows";
        diag = data ? Object.keys(data).slice(0, 4).join(",") : "no data";
        rows = synth();
      }
      render();
    });
  });
